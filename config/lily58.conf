# Typeractive Lily58 Wireless defaults for nice!nano v2 controllers.

# Use the nice!nano v2's highest supported transmit power. This matches the
# Typeractive starter configuration and improves wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Favor a fast press response while retaining a conservative release debounce.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Uncomment both encoder options if an EC11 rotary encoder is installed.
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# The nice!views are enabled by the shield stack in build.yaml. Do not enable
# CONFIG_ZMK_DISPLAY here; that option selects the Lily58's SSD1306 OLED path.
